<form [formGroup]="form" (ngSubmit)="onSubmit()" class="payee-form">

  <div class="ws-form-grid">
    <ws-input
      class="ws-form-grid__full"
      label="PAYEES.FIELD_FULL_NAME"
      formControlName="fullName"
      [error]="fullNameError"
    />

    <ws-input
      label="PAYEES.FIELD_EMPLOYEE_CODE"
      formControlName="employeeCode"
      [error]="hasError('employeeCode', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-input
      type="email"
      [label]="emailRequired() ? 'PAYEES.FIELD_EMAIL' : 'PAYEES.FIELD_EMAIL_OPTIONAL'"
      formControlName="email"
      [error]="hasError('email', 'required') ? 'VALIDATION.REQUIRED' : hasError('email', 'email') ? 'VALIDATION.EMAIL' : ''"
    />

    <ws-input
      [label]="roleRequired() ? 'PAYEES.FIELD_ROLE' : 'PAYEES.FIELD_ROLE_OPTIONAL'"
      formControlName="role"
      [error]="hasError('role', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-date-picker
      [label]="hireDateRequired() ? 'PAYEES.FIELD_HIRE_DATE' : 'PAYEES.FIELD_HIRE_DATE_OPTIONAL'"
      formControlName="hireDate"
      [error]="hasError('hireDate', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-select
      class="ws-form-grid__full"
      [label]="managerRequired() ? 'PAYEES.FIELD_MANAGER' : 'PAYEES.FIELD_MANAGER_OPTIONAL'"
      formControlName="managerId"
      [searchFn]="managerSearchFn"
      [initialOption]="managerInitialOption()"
      [placeholder]="'PAYEES.FIELD_MANAGER_PLACEHOLDER'"
      [error]="hasError('managerId', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-select
      [label]="employmentTypeRequired() ? 'PAYEES.FIELD_EMPLOYMENT_TYPE' : 'PAYEES.FIELD_EMPLOYMENT_TYPE_OPTIONAL'"
      formControlName="employmentType"
      [options]="employmentTypeOptions"
      [placeholder]="'PAYEES.FIELD_EMPLOYMENT_TYPE_PLACEHOLDER'"
      [error]="hasError('employmentType', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-input
      [label]="locationRequired() ? 'PAYEES.FIELD_LOCATION' : 'PAYEES.FIELD_LOCATION_OPTIONAL'"
      formControlName="location"
      [error]="hasError('location', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />
  </div>

  <div class="form-actions">
    <ws-button variant="ghost" type="button" (click)="onCancel()">
      {{ 'COMMON.CANCEL' | translate }}
    </ws-button>
    <ws-button variant="primary" type="submit" [loading]="saving()" [disabled]="saving()">
      {{ (isEditMode() ? 'COMMON.SAVE' : 'PAYEES.ACTION_CREATE') | translate }}
    </ws-button>
  </div>

</form>
