<app-shell>
  <div class="quota-create-page">
    <ws-page-header
      title="QUOTAS.CREATE_TITLE"
      subtitle="QUOTAS.CREATE_SUBTITLE"
      [backRoute]="returnTo() ?? '/quotas'"
      backLabel="QUOTAS.TITLE"
    />

    <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="quota-create-form">

      <div class="ws-form-grid">
        <ws-select
          class="ws-form-grid__full"
          label="QUOTAS.FIELD_PAYEE"
          formControlName="payeeId"
          [searchFn]="payeeSearchFn"
          [initialOption]="preselectedPayeeOption()"
          [error]="hasError('payeeId', 'required') ? 'VALIDATION.REQUIRED' : ''"
        />

        <ws-select
          class="ws-form-grid__full"
          label="QUOTAS.FIELD_PLAN"
          formControlName="planId"
          [searchFn]="planSearchFn"
          [error]="hasError('planId', 'required') ? 'VALIDATION.REQUIRED' : ''"
        />

        <ws-select
          label="QUOTAS.FIELD_MEASUREMENT_TYPE"
          formControlName="measurementType"
          [options]="measurementTypes"
          [error]="hasError('measurementType', 'required') ? 'VALIDATION.REQUIRED' : ''"
        />

        <div class="amount-pair">
          <ws-input
            label="QUOTAS.FIELD_AMOUNT"
            type="number"
            formControlName="amount"
            [error]="hasError('amount', 'required') ? 'VALIDATION.REQUIRED' : hasError('amount', 'min') ? 'QUOTAS.FIELD_AMOUNT_MIN' : ''"
          />
          <ws-input
            label="QUOTAS.FIELD_CURRENCY"
            formControlName="currency"
            [placeholder]="planCurrencyLocked() ? '' : ('QUOTAS.CURRENCY_SELECT_PLAN_FIRST' | translate)"
          />
        </div>

        <ws-date-range-picker
          class="ws-form-grid__full"
          label="QUOTAS.FIELD_PERIOD"
          formControlName="dateRange"
          [error]="rangeError"
        />

        <ws-input
          class="ws-form-grid__full"
          label="QUOTAS.FIELD_NOTES"
          formControlName="notes"
          [error]="hasError('notes', 'maxlength') ? 'VALIDATION.INVALID' : ''"
        />
      </div>

      <div class="form-actions">
        <ws-button variant="ghost" [routerLink]="returnTo() ?? '/quotas'">
          {{ 'COMMON.CANCEL' | translate }}
        </ws-button>
        <ws-button variant="primary" type="submit" [loading]="saving()" [disabled]="saving()">
          {{ 'QUOTAS.ACTION_CREATE' | translate }}
        </ws-button>
      </div>

    </form>
    </div>
  </div>
</app-shell>
