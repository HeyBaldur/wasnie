<div class="upload-step">
  <div
    class="drop-zone"
    [class.drop-zone--dragging]="isDragging()"
    [class.drop-zone--has-file]="!!selectedFile()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <input
      id="file-input"
      type="file"
      accept=".csv,.xlsx"
      class="drop-zone__input"
      (change)="onFileInput($event)"
    />
    @if (selectedFile(); as file) {
      <div class="drop-zone__file">
        <app-icon name="file-text" [size]="32" class="drop-zone__file-icon" />
        <div class="drop-zone__file-info">
          <span class="drop-zone__file-name">{{ file.name }}</span>
          <span class="drop-zone__file-size">{{ formatSize(file.size) }}</span>
        </div>
        <button type="button" class="drop-zone__clear" (click)="selectedFile.set(null); error.set(null)">
          <app-icon name="x" [size]="16" />
        </button>
      </div>
    } @else {
      <label for="file-input" class="drop-zone__label">
        <app-icon name="upload-cloud" [size]="40" class="drop-zone__icon" />
        <span class="drop-zone__title">{{ 'IMPORTS.PAYEES.UPLOAD_PROMPT' | translate }}</span>
        <span class="drop-zone__hint">{{ 'IMPORTS.PAYEES.UPLOAD_HINT' | translate }}</span>
      </label>
    }
  </div>

  @if (error()) {
    <p class="upload-error">
      <app-icon name="alert-circle" [size]="14" />
      {{ error()! | translate }}
    </p>
  }

  <div class="upload-constraints">
    <span>{{ 'IMPORTS.PAYEES.CONSTRAINT_SIZE' | translate }}</span>
    <span class="upload-constraints__sep">·</span>
    <span>{{ 'IMPORTS.PAYEES.CONSTRAINT_ROWS' | translate }}</span>
    <span class="upload-constraints__sep">·</span>
    <button type="button" class="upload-sample-link" (click)="downloadSample()">
      {{ 'IMPORTS.PAYEES.DOWNLOAD_SAMPLE' | translate }}
    </button>
  </div>

  <div class="upload-actions">
    <ws-button
      variant="primary"
      [disabled]="!selectedFile()"
      [loading]="loading()"
      (click)="onParse()"
    >
      <app-icon name="arrow-right" [size]="14" />
      {{ 'IMPORTS.PAYEES.BTN_NEXT' | translate }}
    </ws-button>
  </div>
</div>
