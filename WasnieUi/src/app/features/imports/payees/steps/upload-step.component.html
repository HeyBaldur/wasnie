<div class="upload-step">
  <!-- ★ THE SHARED PICKER (app-import-dropzone), the same one both transaction wizards render.
       Only the hint key differs: this import accepts a payee roster, not sales. -->
  <app-import-dropzone
    accept=".csv,.xlsx"
    hintKey="IMPORTS.PAYEES.UPLOAD_HINT"
    [file]="selectedFile()"
    [busy]="loading()"
    (fileSelected)="selectFile($event)"
    (cleared)="clearFile()"
  />

  @if (error()) {
    <p class="upload-error">
      <app-icon name="alert-circle" [size]="14" />
      {{ error()! | translate }}
    </p>
  }

  <div class="upload-constraints">
    <span>{{ 'IMPORTS.PAYEES.CONSTRAINT_SIZE' | translate }}</span>
    <span class="upload-constraints__sep">·</span>
    <span>{{ 'IMPORTS.PAYEES.CONSTRAINT_ROWS' | translate }}</span>
    <span class="upload-constraints__sep">·</span>
    <button type="button" class="upload-sample-link" (click)="downloadSample()">
      {{ 'IMPORTS.PAYEES.DOWNLOAD_SAMPLE' | translate }}
    </button>
  </div>

  <div class="upload-actions">
    <ws-button
      variant="primary"
      [disabled]="!selectedFile()"
      [loading]="loading()"
      (click)="onParse()"
    >
      <app-icon name="arrow-right" [size]="14" />
      {{ 'IMPORTS.PAYEES.BTN_NEXT' | translate }}
    </ws-button>
  </div>
</div>
