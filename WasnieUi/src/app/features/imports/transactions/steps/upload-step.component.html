<div class="upload-step">
  <!-- ★ THE ZONE AND THE FILE CARD ARE ONE SHARED COMPONENT (app-import-dropzone), used identically
       by the update wizard and the payees wizard. Everything below it — validation messages, the
       constraints line, the sample download and the Next button — stays here, because it is this
       import's business and not the picker's. -->
  <app-import-dropzone
    accept=".csv,.xlsx"
    hintKey="IMPORTS.TRANSACTIONS.UPLOAD_HINT"
    [file]="selectedFile()"
    [busy]="loading()"
    (fileSelected)="selectFile($event)"
    (cleared)="clearFile()"
  />

  @if (error()) {
    <p class="upload-error">
      <app-icon name="alert-circle" [size]="14" />
      {{ error()! | translate }}
    </p>
  }

  <div class="upload-constraints">
    <span>{{ 'IMPORTS.TRANSACTIONS.CONSTRAINT_SIZE' | translate }}</span>
    <span class="upload-constraints__sep">·</span>
    <span>{{ 'IMPORTS.TRANSACTIONS.CONSTRAINT_ROWS' | translate : { count: maxRows() | number } }}</span>
    <span class="upload-constraints__sep">·</span>
    <button type="button" class="upload-sample-link" (click)="downloadSample()">
      {{ 'IMPORTS.TRANSACTIONS.DOWNLOAD_SAMPLE' | translate }}
    </button>
  </div>

  <div class="upload-actions">
    <ws-button
      variant="primary"
      [disabled]="!selectedFile()"
      [loading]="loading()"
      (click)="onParse()"
    >
      <app-icon name="arrow-right" [size]="14" />
      {{ 'IMPORTS.TRANSACTIONS.BTN_NEXT' | translate }}
    </ws-button>
  </div>
</div>
