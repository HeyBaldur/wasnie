<div class="upload-step">
  <!-- ★ THE SHARED PICKER (app-import-dropzone). This step used to carry its own copy of the zone
       markup; only the validation and the Next button were ever different. -->
  <app-import-dropzone
    accept=".csv,.xlsx"
    hintKey="IMPORTS.TRANSACTIONS.UPLOAD_HINT"
    [file]="selectedFile()"
    [busy]="loading()"
    (fileSelected)="selectFile($event)"
    (cleared)="clearFile()"
  />

  @if (error()) {
    <p class="upload-error">
      <app-icon name="alert-circle" [size]="14" />
      {{ error()! | translate }}
    </p>
  }

  <div class="upload-constraints">
    <span>{{ 'IMPORTS.TRANSACTIONS.CONSTRAINT_SIZE' | translate }}</span>
  </div>

  <div class="upload-actions">
    <ws-button
      variant="primary"
      [disabled]="!selectedFile()"
      [loading]="loading()"
      (click)="onParse()"
    >
      <app-icon name="arrow-right" [size]="14" />
      {{ 'IMPORTS.TRANSACTIONS.BTN_NEXT' | translate }}
    </ws-button>
  </div>
</div>
