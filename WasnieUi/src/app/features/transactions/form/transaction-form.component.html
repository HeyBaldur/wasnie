<form [formGroup]="form" (ngSubmit)="onSubmit()" class="transaction-form">

  <div class="ws-form-grid">
    <ws-select
      class="ws-form-grid__full"
      [label]="payeeRequired() ? 'TRANSACTIONS.FIELD_PAYEE' : 'TRANSACTIONS.FIELD_PAYEE_OPTIONAL'"
      formControlName="payeeId"
      [searchFn]="payeeSearchFn"
      [error]="hasError('payeeId', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <ws-input
      class="ws-form-grid__full"
      label="TRANSACTIONS.FIELD_REFERENCE_NUMBER"
      formControlName="referenceNumber"
      [error]="hasError('referenceNumber', 'required') ? 'VALIDATION.REQUIRED' : hasError('referenceNumber', 'maxlength') ? 'VALIDATION.INVALID' : ''"
    />

    <ws-input
      class="ws-form-grid__full"
      label="TRANSACTIONS.FIELD_DESCRIPTION"
      formControlName="description"
      [placeholder]="'TRANSACTIONS.FIELD_DESCRIPTION_PLACEHOLDER' | translate"
      [error]="hasError('description', 'maxlength') ? 'VALIDATION.INVALID' : ''"
    />

    <ws-date-picker
      [label]="'TRANSACTIONS.FIELD_DATE'"
      formControlName="transactionDate"
      [error]="hasError('transactionDate', 'required') ? 'VALIDATION.REQUIRED' : ''"
    />

    <div class="amount-pair">
      <ws-input
        label="TRANSACTIONS.FIELD_AMOUNT"
        type="number"
        formControlName="amount"
        [error]="hasError('amount', 'required') ? 'VALIDATION.REQUIRED' : hasError('amount', 'min') ? 'TRANSACTIONS.FIELD_AMOUNT_MIN' : ''"
      />
      <ws-select
        label="TRANSACTIONS.FIELD_CURRENCY"
        formControlName="currency"
        [options]="currencies"
      />
    </div>

    <ws-input
      label="TRANSACTIONS.FIELD_QUANTITY"
      type="number"
      formControlName="quantity"
      placeholder="1"
      [error]="hasError('quantity', 'min') ? 'TRANSACTIONS.FIELD_QUANTITY_MIN' : ''"
    />

    <!-- Process-immediately checkbox -->
    <div class="process-immediately ws-form-grid__full">
      <label class="process-immediately__label">
        <input
          type="checkbox"
          class="process-immediately__checkbox"
          formControlName="processImmediately"
        />
        <span>{{ 'TRANSACTIONS.PROCESS_IMMEDIATELY_LABEL' | translate }}</span>
      </label>
      <p class="process-immediately__hint">
        {{ 'TRANSACTIONS.PROCESS_IMMEDIATELY_HINT' | translate }}
      </p>
    </div>

    <!-- Informative note: amount cannot be edited once processed -->
    <div class="form-info-note ws-form-grid__full">
      <svg class="form-info-note__icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.25"/>
        <path d="M8 7v4M8 5.5v.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <p class="form-info-note__text">{{ 'TRANSACTIONS.RECORD_INFO_NOTE' | translate }}</p>
    </div>

    <p class="source-info ws-form-grid__full">
      {{ 'TRANSACTIONS.SOURCE_INFO' | translate }}
    </p>
  </div>

  <div class="form-actions">
    <ws-button variant="ghost" type="button" (click)="onCancel()">
      {{ 'COMMON.CANCEL' | translate }}
    </ws-button>
    <ws-button variant="primary" type="submit" [loading]="saving()" [disabled]="saving()">
      {{ 'TRANSACTIONS.ACTION_CREATE' | translate }}
    </ws-button>
  </div>

</form>
