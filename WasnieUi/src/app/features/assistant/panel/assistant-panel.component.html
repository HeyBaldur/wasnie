<!--
  ★ `closing()` is what keeps the panel on screen after it has ALREADY closed. The shared state flips
  the moment the user asks to close — see the component for why the other order was the bug — and this
  flag holds the element for the length of its exit animation and not a millisecond of meaning longer.
-->
@if (store.isOpen() || closing()) {
  <!-- Backdrop: dismisses on click, like every other overlay in the app. -->
  <div
    class="assistant-backdrop"
    [class.assistant-backdrop--closing]="!store.isOpen()"
    (click)="close()"
    data-testid="assistant-backdrop"
  ></div>

  <!--
    ★ IT STAYS MOUNTED WHILE IT LEAVES. `@if` would tear the panel out instantly and there would be
    nothing left to animate, so `closing` keeps it for the length of the exit and `animationend` is
    what finally closes it — see the component.

    While it is leaving it stops being a dialog: `aria-modal` and the label are dropped and it is
    hidden from assistive technology, because a screen reader announcing a dialog the user has already
    dismissed is worse than no animation at all.
  -->
  <aside
    class="assistant-panel"
    [class.assistant-panel--closing]="!store.isOpen()"
    (animationend)="onCloseAnimationEnd($event)"
    role="dialog"
    [attr.aria-modal]="store.isOpen() ? 'true' : null"
    [attr.aria-hidden]="store.isOpen() ? null : 'true'"
    [attr.aria-label]="store.isOpen() ? ('ASSISTANT.TITLE' | translate) : null"
    data-testid="assistant-panel"
  >
    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="assistant-panel__head">
      <div class="assistant-panel__title-group">
        <span class="assistant-panel__title">
          @if (isUntitled(store.conversation()?.title)) {
            {{ 'ASSISTANT.UNTITLED' | translate }}
          } @else {
            {{ store.conversation()!.title }}
          }
        </span>
        <span class="assistant-panel__subtitle">{{ 'ASSISTANT.SUBTITLE' | translate }}</span>
      </div>

      <div class="assistant-panel__head-actions">
        <!--
          ★ EXPAND, NOT "OPEN IN A NEW TAB". It routes to /assistant/{id} inside the app, so the SAME
          live conversation is simply shown wider — the store is the one both views read. A new browser
          tab would boot a second copy of the app and start the thread over, which is the opposite of
          what this button promises.

          The drawer is closed on the way out: leaving it open would put the slide-over on top of the
          full-page version of itself.
        -->
        <ws-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          (click)="expand()"
          [title]="'ASSISTANT.EXPAND' | translate"
          [attr.aria-label]="'ASSISTANT.EXPAND' | translate"
          data-testid="assistant-expand"
        >
          <app-icon name="maximize" [size]="16" />
        </ws-button>

        <ws-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          (click)="store.toggleHistory()"
          [title]="'ASSISTANT.HISTORY' | translate"
          data-testid="assistant-history-toggle"
        >
          <app-icon name="list" [size]="16" />
        </ws-button>

        <ws-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          (click)="startNew()"
          [title]="'ASSISTANT.NEW_CONVERSATION' | translate"
          data-testid="assistant-new"
        >
          <app-icon name="plus" [size]="16" />
        </ws-button>

        <ws-button
          variant="ghost"
          size="sm"
          [iconOnly]="true"
          (click)="close()"
          [title]="'ASSISTANT.CLOSE' | translate"
          data-testid="assistant-close"
        >
          <app-icon name="x" [size]="16" />
        </ws-button>
      </div>
    </header>

    <!-- ── History ────────────────────────────────────────────────────────── -->
    <!-- The dropdown box is the drawer's; the rows inside it are shared with the full page. -->
    @if (store.historyOpen()) {
      <div class="assistant-history ws-scroll-thin" data-testid="assistant-history">
        <app-assistant-conversation-list (select)="openConversation($event)" />
      </div>
    }

    <!--
      The conversation itself — message list, streaming answer, the failed/cancelled turns, the
      welcome and the composer — lives in a component SHARED with the full-page assistant at
      /assistant. The drawer is the chrome around it, nothing more. [visible] is the drawer's own
      open state: the conversation uses it to tell "a fresh view" from "a new turn arriving", which
      is what decides whether the scroll jumps or glides.
    -->
    <app-assistant-conversation [visible]="store.isOpen()" />
  </aside>
}
