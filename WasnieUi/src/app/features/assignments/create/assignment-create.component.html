<app-shell>
  <div class="assignment-create-page">
    <ws-page-header
      title="ASSIGNMENTS.CREATE_TITLE"
      subtitle="ASSIGNMENTS.CREATE_SUBTITLE"
      [backRoute]="returnTo() ?? '/assignments'"
      backLabel="ASSIGNMENTS.TITLE"
    />

    <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="assignment-create-form">

      <div class="ws-form-grid">
        <ws-select
          class="ws-form-grid__full"
          label="ASSIGNMENTS.FIELD_PAYEE"
          formControlName="payeeId"
          [searchFn]="payeeSearchFn"
          [initialOption]="preselectedPayeeOption()"
          [error]="hasError('payeeId', 'required') ? 'VALIDATION.REQUIRED' : ''"
        />

        <ws-select
          class="ws-form-grid__full"
          label="ASSIGNMENTS.FIELD_PLAN"
          formControlName="planId"
          [searchFn]="planSearchFn"
          [initialOption]="preselectedPlanOption()"
          [error]="hasError('planId', 'required') ? 'VALIDATION.REQUIRED' : ''"
        />

        <ws-date-range-picker
          class="ws-form-grid__full"
          label="ASSIGNMENTS.FIELD_PERIOD"
          formControlName="dateRange"
          [error]="rangeError"
        />
      </div>

      <div class="form-actions">
        <ws-button variant="ghost" [routerLink]="returnTo() ?? '/assignments'">
          {{ 'COMMON.CANCEL' | translate }}
        </ws-button>
        <ws-button variant="primary" type="submit" [loading]="saving()" [disabled]="saving()">
          {{ 'ASSIGNMENTS.ACTION_CREATE' | translate }}
        </ws-button>
      </div>

    </form>
    </div>
  </div>
</app-shell>
