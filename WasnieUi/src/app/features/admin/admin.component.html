<app-shell>
  <div class="settings-page">
    <ws-page-header
      [title]="'EMPTY_STATE.ADMIN_TITLE' | translate"
      [subtitle]="'EMPTY_STATE.ADMIN_DESC' | translate"
    />

    <div class="settings-sections">
      <app-appearance-card />
    </div>

    <!-- KAN-80: the assistant's token usage for this account. Renders nothing when there is none to act on. -->
    <div class="settings-sections">
      <app-assistant-usage-card />
    </div>

    <div class="settings-sections" *hasPermission="'Settings.Update'">
      <app-field-requirements />
    </div>
  </div>
</app-shell>
