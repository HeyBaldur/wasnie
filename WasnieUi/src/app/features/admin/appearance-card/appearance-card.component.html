<div class="settings-card">
  <h3 class="settings-section-title">{{ 'SETTINGS.APPEARANCE_TITLE' | translate }}</h3>
  <p class="settings-section-desc">{{ 'SETTINGS.APPEARANCE_DESC' | translate }}</p>

  <div class="appearance-rows">

    <div class="appearance-row">
      <span class="appearance-row__label">{{ 'SETTINGS.LANGUAGE' | translate }}</span>
      <!--
        ★ LA MISMA BANDERA QUE EN SIGN IN / SIGN UP, del mismo componente. Aquí sólo se leían los
        códigos EN/ES/PL: dos selectores del mismo ajuste, uno antes de entrar y otro dentro, que no
        se parecían en nada.

        ★ EL NOMBRE VA EN SU PROPIO IDIOMA (endónimo), igual que en el popover de las pantallas sin
        sesión: quien busca "Polski" no reconoce "Polish". Son las claves LANGUAGE.*, que resuelven a
        la misma cadena en los tres archivos de i18n.
      -->
      <div class="lang-switcher">
        @for (option of languageOptions; track option.code) {
          <button
            class="lang-btn"
            [class.lang-btn--active]="currentLang() === option.code"
            [attr.aria-pressed]="currentLang() === option.code"
            (click)="switchLanguage(option.code)"
          >
            <app-language-flag [code]="option.code" />
            <span>{{ option.labelKey | translate }}</span>
          </button>
        }
      </div>
    </div>

    <div class="appearance-row">
      <span class="appearance-row__label">{{ 'SETTINGS.THEME' | translate }}</span>
      <div class="theme-options">
        @for (option of themeOptions; track option.mode) {
          <button
            class="theme-btn"
            [class.theme-btn--active]="currentTheme() === option.mode"
            (click)="selectTheme(option.mode)"
          >
            <span class="theme-btn__icon" aria-hidden="true">{{ option.icon }}</span>
            <span class="theme-btn__label">{{ option.labelKey | translate }}</span>
          </button>
        }
      </div>
    </div>

  </div>
</div>
