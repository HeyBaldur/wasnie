<form [formGroup]="form" (ngSubmit)="submit()" class="invite-form">
  <div class="invite-form__field">
    <ws-input
      formControlName="email"
      type="email"
      [label]="'USERS.INVITE.EMAIL_LABEL' | translate"
      [placeholder]="'USERS.INVITE.EMAIL_PLACEHOLDER' | translate"
      [error]="form.controls.email.touched && form.controls.email.invalid
        ? ('USERS.INVITE.EMAIL_ERROR' | translate) : ''"
    />
  </div>

  <!-- Relationship-style dropdown: full row, per §5.6. -->
  <div class="invite-form__field">
    <ws-select
      formControlName="role"
      [options]="roleOptions()"
      [label]="'USERS.INVITE.ROLE_LABEL' | translate"
      [placeholder]="'USERS.INVITE.ROLE_PLACEHOLDER' | translate"
      [error]="form.controls.role.touched && form.controls.role.invalid
        ? ('USERS.INVITE.ROLE_ERROR' | translate) : ''"
    />
  </div>

  <p class="invite-form__hint">{{ 'USERS.INVITE.HINT' | translate }}</p>

  <div class="invite-form__actions">
    <ws-button variant="ghost" type="button" [disabled]="submitting()" (click)="cancelled.emit()">
      {{ 'COMMON.CANCEL' | translate }}
    </ws-button>
    <ws-button variant="primary" type="submit" [disabled]="submitting()">
      {{ 'USERS.INVITE.SUBMIT' | translate }}
    </ws-button>
  </div>
</form>
