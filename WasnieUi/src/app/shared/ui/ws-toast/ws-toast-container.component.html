<div class="ws-toast-stack" aria-live="polite" aria-atomic="false">
  @for (toast of toastService.toasts(); track trackToast($index, toast)) {
    <div class="ws-toast ws-toast--{{ toast.type }}" role="alert">
      <span class="ws-toast__accent"></span>
      <span class="ws-toast__message">{{ toast.message | translate }}</span>
      <button
        class="ws-toast__close"
        type="button"
        (click)="dismiss(toast.id)"
        aria-label="Dismiss"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
