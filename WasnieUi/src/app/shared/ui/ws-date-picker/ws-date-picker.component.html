<div class="ws-dp" (click)="stopProp($event)">
  @if (label()) {
    <label class="ws-dp__label">{{ label() | translate }}</label>
  }

  <div
    class="ws-dp__trigger"
    [class.ws-dp__trigger--open]="isOpen()"
    [class.ws-dp__trigger--disabled]="isDisabled()"
    (click)="open($event)"
  >
    <app-icon name="calendar" [size]="15" class="ws-dp__cal-icon" />
    <span class="ws-dp__display" [class.ws-dp__display--placeholder]="!displayValue()">
      {{ displayValue() || (placeholder() | translate) }}
    </span>
    <app-icon name="chevron-right" [size]="14" class="ws-dp__chevron" [class.ws-dp__chevron--open]="isOpen()" />
  </div>

  @if (isOpen()) {
    <div class="ws-dp__popover">
      <div class="ws-dp__nav">
        <button type="button" class="ws-dp__nav-btn" (click)="prevMonth()">
          <app-icon name="chevron-left" [size]="16" />
        </button>
        <span class="ws-dp__nav-label">{{ monthLabel() }} {{ viewYear() }}</span>
        <button type="button" class="ws-dp__nav-btn" (click)="nextMonth()">
          <app-icon name="chevron-right" [size]="16" />
        </button>
      </div>

      <div class="ws-dp__grid">
        @for (key of dayKeys; track key) {
          <span class="ws-dp__day-head">{{ key | translate }}</span>
        }
        @for (cell of calendarDays(); track $index) {
          <button
            type="button"
            class="ws-dp__cell"
            [class.ws-dp__cell--today]="cell.isToday"
            [class.ws-dp__cell--selected]="cell.isSelected"
            [class.ws-dp__cell--empty]="cell.isOtherMonth"
            [class.ws-dp__cell--disabled]="cell.isDisabled"
            [disabled]="cell.isDisabled"
            (click)="selectDate(cell)"
          >
            @if (!cell.isOtherMonth && cell.date) {
              {{ cell.dayNum }}
            }
          </button>
        }
      </div>

      <div class="ws-dp__footer">
        <button type="button" class="ws-dp__today-btn" (click)="selectToday()">
          {{ 'DATEPICKER.TODAY' | translate }}
        </button>
      </div>
    </div>
  }

  @if (error()) {
    <span class="ws-dp__error">{{ error() | translate }}</span>
  }
</div>
