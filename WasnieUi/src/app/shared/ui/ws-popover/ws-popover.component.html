<div class="ws-pop" (click)="stopProp($event)">
  <div class="ws-pop__trigger" (click)="toggle()">
    <ng-content select="[slot=trigger]" />
  </div>

  @if (isOpen()) {
    <!--
      resolvedPlacement(), not placement(): the panel flips to the other side of the trigger when the
      preferred one has no room. See WsPopoverComponent.resolvedPlacement.
    -->
    <div #popover [class]="'ws-pop__panel ws-pop__panel--' + resolvedPlacement()">
      <ng-content />
    </div>
  }
</div>
