<div class="ws-bc" (mouseleave)="onSvgMouseLeave()">

  @if (!hasData()) {
    <div class="ws-bc__empty">
      <span>{{ emptyLabel() }}</span>
    </div>
  } @else {
    <svg
      #svgEl
      class="ws-bc__svg"
      [attr.viewBox]="'0 0 ' + VB_W + ' ' + VB_H"
      role="img"
      aria-label="Bar chart showing monthly earnings for the past 12 months"
      xmlns="http://www.w3.org/2000/svg"
      (mousemove)="onSvgMouseMove($event)"
    >
      <!-- Y gridlines + labels -->
      @for (tick of yTicks(); track tick.value) {
        <line
          [attr.x1]="ML" [attr.y1]="tick.y"
          [attr.x2]="VB_W - MR" [attr.y2]="tick.y"
          class="ws-bc__grid"
        />
        @if (tick.value > 0) {
          <text
            [attr.x]="ML - 6"
            [attr.y]="tick.y"
            text-anchor="end"
            dominant-baseline="middle"
            class="ws-bc__axis-label"
          >{{ tick.value | number: '1.0-0' }}</text>
        }
      }

      <!-- X-axis baseline -->
      <line
        [attr.x1]="ML" [attr.y1]="MT + chartH()"
        [attr.x2]="VB_W - MR" [attr.y2]="MT + chartH()"
        class="ws-bc__grid"
      />

      <!-- Bars + X-axis labels -->
      @for (bar of bars(); track bar.index) {
        <rect
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          rx="3" ry="3"
          [class]="bar.point.isCurrent ? 'ws-bc__bar ws-bc__bar--current' : 'ws-bc__bar ws-bc__bar--past'"
        >
          <title>{{ bar.point.label }}: {{ formatValue(bar.point.value, bar.point.currency ?? '') }}</title>
        </rect>

        <text
          [attr.x]="barLabelX(bar.index)"
          [attr.y]="VB_H - 6"
          text-anchor="middle"
          class="ws-bc__axis-label"
          [class.ws-bc__axis-label--current]="bar.point.isCurrent"
        >{{ bar.point.label }}</text>
      }
    </svg>

    <!-- Hover tooltip -->
    @if (tooltipVisible()) {
      <div class="ws-bc__tooltip" [style.left.%]="tooltipX()">
        <p class="ws-bc__tooltip-label">{{ tooltipLabel() }}</p>
        <p class="ws-bc__tooltip-value">
          @if (tooltipIsEmpty()) {
            <span class="ws-bc__tooltip-empty">No earnings</span>
          } @else {
            {{ formatValue(tooltipValue(), tooltipCurrency()) }}
            @if (tooltipCurrency()) {
              <span class="ws-bc__tooltip-currency">{{ tooltipCurrency() }}</span>
            }
          }
        </p>
      </div>
    }
  }
</div>
