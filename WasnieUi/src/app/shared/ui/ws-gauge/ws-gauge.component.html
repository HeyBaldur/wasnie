<svg
  class="ws-gauge"
  viewBox="0 0 200 120"
  role="img"
  [attr.aria-label]="ariaLabel()"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Gradient for area fill (not used here but reserved) -->
  <defs>
    <linearGradient [attr.id]="'gauge-fill-' + value()" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" [attr.stop-color]="fillColor()" stop-opacity="0.7" />
      <stop offset="100%" [attr.stop-color]="fillColor()" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Background track -->
  <path
    class="ws-gauge__track"
    [attr.d]="trackPath"
    fill="none"
    stroke="var(--color-bg-surface-sunken)"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Value fill — stroke-linecap="butt" prevents the round-cap dot artifact
       at very low attainment values (< ~5%) where the cap is wider than the arc. -->
  <path
    class="ws-gauge__fill"
    [attr.d]="trackPath"
    fill="none"
    [attr.stroke]="fillColor()"
    stroke-width="14"
    stroke-linecap="butt"
    [attr.stroke-dasharray]="fillDashArray()"
    stroke-dashoffset="0"
  />

  <!-- Percentage text -->
  <text
    x="100"
    y="88"
    text-anchor="middle"
    dominant-baseline="auto"
    class="ws-gauge__pct"
    [attr.fill]="fillColor()"
  >{{ percentText() }}</text>

  <!-- Pacing target marker -->
  @if (pacingPoint(); as pt) {
    <circle
      [attr.cx]="pt.x"
      [attr.cy]="pt.y"
      r="5"
      fill="var(--color-bg-surface-raised)"
      stroke="var(--color-text-tertiary)"
      stroke-width="2"
      class="ws-gauge__pacing"
    />
  }

  <!-- Sub-label below percentage -->
  @if (label()) {
    <text
      x="100"
      y="108"
      text-anchor="middle"
      dominant-baseline="auto"
      class="ws-gauge__label"
      fill="var(--color-text-tertiary)"
    >{{ label() }}</text>
  }
</svg>
