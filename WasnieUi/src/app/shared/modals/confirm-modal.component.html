@if (modalService.config(); as cfg) {
  <ws-modal
    [isOpen]="true"
    [title]="cfg.title | translate"
    [description]="cfg.message | translate"
    [closable]="false"
    [closeOnBackdrop]="false"
    size="sm"
    (closed)="modalService.respond(false)"
  >
    <ws-button slot="footer" variant="ghost" (click)="modalService.respond(false)">
      {{ cfg.cancelLabel | translate }}
    </ws-button>
    <ws-button
      slot="footer"
      [variant]="cfg.variant === 'danger' ? 'danger' : 'primary'"
      (click)="modalService.respond(true)"
    >
      {{ cfg.confirmLabel | translate }}
    </ws-button>
  </ws-modal>
}
