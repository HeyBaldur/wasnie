@if (visible()) {
  <div
    class="tfa-reminder"
    [class.tfa-reminder--hiding]="hiding()"
    role="complementary"
    [attr.aria-label]="'TWO_FACTOR.REMINDER_TITLE' | translate"
  >
    <div class="tfa-reminder__header">
      <span class="tfa-reminder__icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
      </span>
      <h3 class="tfa-reminder__title">{{ 'TWO_FACTOR.REMINDER_TITLE' | translate }}</h3>
      <button
        class="tfa-reminder__close"
        type="button"
        (click)="close()"
        aria-label="Close"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <p class="tfa-reminder__body">{{ 'TWO_FACTOR.REMINDER_BODY' | translate }}</p>

    <div class="tfa-reminder__actions">
      <ws-button variant="primary" size="sm" [fullWidth]="true" (click)="activate()">
        {{ 'TWO_FACTOR.REMINDER_ACTIVATE' | translate }}
      </ws-button>
      <ws-button variant="secondary" size="sm" [fullWidth]="true" (click)="snooze()">
        {{ 'TWO_FACTOR.REMINDER_SNOOZE' | translate }}
      </ws-button>
    </div>

    <button class="tfa-reminder__dismiss" type="button" (click)="dismiss()">
      {{ 'TWO_FACTOR.REMINDER_DISMISS' | translate }}
    </button>
  </div>
}
