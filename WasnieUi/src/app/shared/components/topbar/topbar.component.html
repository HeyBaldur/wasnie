<header class="topbar">
  <div class="topbar__search">
    <app-icon name="search" [size]="15" class="topbar__search-icon" />
    <input
      class="topbar__search-input"
      type="search"
      [placeholder]="'TOPBAR.SEARCH_PLACEHOLDER' | translate"
      aria-label="Search"
      autocomplete="off"
    />
    <span class="topbar__search-kbd">⌘K</span>
  </div>

  <div class="topbar__actions">
    <!-- KAN-77: the trial's days left, as a status beside the assistant. Renders nothing outside a trial. -->
    <app-trial-banner />

    <!--
      HubSpot's hourly sync, in the same pill shape. It renders nothing unless HubSpot is actually Connected
      for this tenant, so most topbars never show it.

      ★ THE PERMISSION GATE CAME WITH IT FROM THE SIDEBAR (§5.8: hidden, not disabled). Somebody who cannot
      manage integrations has no use for a link to the Integrations page and would only find a locked door.
    -->
    @if ('Integrations.Manage' | hasPermission) {
      <app-hubspot-sync-pill />
    }

    <!-- Hidden entirely when the user has no assistant entitlement (hide, don't disable). -->
    <app-assistant-trigger />


    <!--
      The user manual, beside the user rather than in the sidebar: it is help, not a destination in the
      product's navigation, and it sat oddly among Subscription / Integrations / Settings.

      No permission gate — the manual documents the product, holds no tenant data, and hiding it would
      keep the instructions from the users with the fewest rights, who need them most. Icon-only, so it
      stays quiet next to the plan badge and the assistant.
    -->
    <!--
      ★ A TOPBAR BUTTON, NOT `ws-button`, AND THE REASON IS THE SHAPE. It has to be a round 32px control;
      `ws-button` carries the design system's own radius and padding, and forcing a circle onto it would
      mean reaching into a shared primitive with ::ng-deep to override exactly the rules that make it
      consistent everywhere else. The topbar already styles its own controls this way — the avatar and the
      plan badges are plain buttons — so this follows the file's own precedent instead of bending a
      component from outside.

      ★★ THE GLYPH IS A DOCUMENT, NOT AN ‘i’ IN A CIRCLE. `info-circle` put a circle inside the button's own
      circle — two concentric rings 3px apart, which is the kind of thing that reads as sloppy without
      anyone being able to say why. It also said the wrong thing: this opens the user MANUAL, a document,
      not a tooltip's worth of information.

      ★ THE TOOLTIP IS `wsTooltip`, NOT `title`. Every other control in this row explains itself through
      the design system's tooltip; the native one arrives late, in the OS's own styling, and looked like a
      different product. The sr-only span below stays — that is the accessible name, and it is a separate
      job from the sighted hint.
    -->
    <button
      type="button"
      class="topbar__manual-btn"
      routerLink="/manual"
      [wsTooltip]="'NAV.MANUAL' | translate"
      tooltipPlacement="bottom"
    >
      <app-icon name="document-text" [size]="17" />
      <!--
        The accessible name. An icon-only button has none otherwise, and `aria-label` would have to sit on
        this element anyway — projected text is what a screen reader reads out.
      -->
      <span class="topbar__sr-only">{{ 'NAV.MANUAL' | translate }}</span>
    </button>

    <div class="topbar__avatar-wrapper">
      <button class="topbar__avatar-btn" (click)="toggleDropdown($event)">
        <span class="topbar__avatar">{{ userInitial() }}</span>
      </button>

      @if (dropdownOpen()) {
        <div class="topbar__dropdown" (click)="$event.stopPropagation()">
          <div class="topbar__dropdown-header">
            <span class="topbar__dropdown-name">{{ tenantSlug() }}</span>
            <span class="topbar__dropdown-email">{{ authService.currentUser()?.email }}</span>
          </div>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item" (click)="goToProfile()">
            <app-icon name="user" [size]="15" />
            {{ 'TOPBAR.PROFILE' | translate }}
          </button>
          <button class="topbar__dropdown-item" (click)="goToSettings()">
            <app-icon name="tenant" [size]="15" />
            {{ 'TOPBAR.TENANT_SETTINGS' | translate }}
          </button>
          <!-- ★ RBAC HIDES, IT DOES NOT DISABLE (§5.8). Without Audit.Read the entry is absent — not
               greyed out, which would advertise a page the reader may never open. The route carries
               the same guard, so removing this button is not the security control, only the manners. -->
          @if ('Audit.Read' | hasPermission) {
            <button class="topbar__dropdown-item" (click)="goToAuditLogs()">
              <app-icon name="shield" [size]="15" />
              {{ 'TOPBAR.AUDIT_LOGS' | translate }}
            </button>
          }
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item topbar__dropdown-item--danger" (click)="logout()">
            <app-icon name="log-out" [size]="15" />
            {{ 'TOPBAR.SIGN_OUT' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
