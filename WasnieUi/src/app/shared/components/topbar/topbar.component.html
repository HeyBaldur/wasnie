<header class="topbar">
  <div class="topbar__search">
    <app-icon name="search" [size]="15" class="topbar__search-icon" />
    <input
      class="topbar__search-input"
      type="search"
      [placeholder]="'TOPBAR.SEARCH_PLACEHOLDER' | translate"
      aria-label="Search"
      autocomplete="off"
    />
    <span class="topbar__search-kbd">⌘K</span>
  </div>

  <div class="topbar__actions">
    @if (isFreeTier()) {
      <div
        class="topbar__upgrade-wrapper"
        [attr.data-tooltip]="'TOPBAR.UPGRADE_TOOLTIP' | translate"
      >
        <button class="topbar__upgrade-btn" (click)="goToUpgrade()">
          {{ 'TOPBAR.UPGRADE_BTN' | translate }}
        </button>
      </div>
    }

    <div class="topbar__avatar-wrapper">
      <button class="topbar__avatar-btn" (click)="toggleDropdown($event)">
        <span class="topbar__avatar">{{ userInitial() }}</span>
      </button>

      @if (dropdownOpen()) {
        <div class="topbar__dropdown" (click)="$event.stopPropagation()">
          <div class="topbar__dropdown-header">
            <span class="topbar__dropdown-name">{{ tenantSlug() }}</span>
            <span class="topbar__dropdown-email">{{ authService.currentUser()?.email }}</span>
          </div>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item">
            <app-icon name="user" [size]="15" />
            {{ 'TOPBAR.PROFILE' | translate }}
          </button>
          <button class="topbar__dropdown-item" (click)="goToSettings()">
            <app-icon name="tenant" [size]="15" />
            {{ 'TOPBAR.TENANT_SETTINGS' | translate }}
          </button>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item topbar__dropdown-item--danger" (click)="logout()">
            <app-icon name="log-out" [size]="15" />
            {{ 'TOPBAR.SIGN_OUT' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
