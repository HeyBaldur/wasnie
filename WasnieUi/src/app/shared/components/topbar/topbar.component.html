<header class="topbar">
  <div class="topbar__search">
    <app-icon name="search" [size]="15" class="topbar__search-icon" />
    <input
      class="topbar__search-input"
      type="search"
      [placeholder]="'TOPBAR.SEARCH_PLACEHOLDER' | translate"
      aria-label="Search"
      autocomplete="off"
    />
    <span class="topbar__search-kbd">⌘K</span>
  </div>

  <div class="topbar__actions">
    <!-- Hidden entirely when the user has no assistant entitlement (hide, don't disable). -->
    <app-assistant-trigger />

    @if (isFreeTier()) {
      <div
        class="topbar__upgrade-wrapper"
        [attr.data-tooltip]="'TOPBAR.UPGRADE_TOOLTIP' | translate"
      >
        <button class="topbar__upgrade-btn" (click)="goToUpgrade()">
          {{ 'TOPBAR.UPGRADE_BTN' | translate }}
        </button>
      </div>
    }

    @if (tierName() === 'Starter') {
      <button
        class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-sm font-medium rounded-md group bg-gradient-to-br from-purple-600 to-blue-500 group-hover:from-purple-600 group-hover:to-blue-500 hover:text-white focus:ring-4 focus:outline-none focus:ring-blue-300"
        (click)="goToSubscription()"
        [title]="'TOPBAR.PLAN_BADGE_TOOLTIP' | translate"
      >
        <span class="relative flex items-center gap-1.5 px-3 py-1 transition-all ease-in duration-75 bg-[var(--color-surface-raised)] rounded-sm group-hover:bg-transparent leading-5 font-semibold text-[var(--color-fg-primary)]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 7.2a2.2 2.2 0 0 1 2.2 -2.2h1a2.2 2.2 0 0 0 1.55 -.64l.7 -.7a2.2 2.2 0 0 1 3.12 0l.7 .7c.412 .41 .97 .64 1.55 .64h1a2.2 2.2 0 0 1 2.2 2.2v1c0 .58 .23 1.138 .64 1.55l.7 .7a2.2 2.2 0 0 1 0 3.12l-.7 .7a2.2 2.2 0 0 0 -.64 1.55v1a2.2 2.2 0 0 1 -2.2 2.2h-1a2.2 2.2 0 0 0 -1.55 .64l-.7 .7a2.2 2.2 0 0 1 -3.12 0l-.7 -.7a2.2 2.2 0 0 0 -1.55 -.64h-1a2.2 2.2 0 0 1 -2.2 -2.2v-1a2.2 2.2 0 0 0 -.64 -1.55l-.7 -.7a2.2 2.2 0 0 1 0 -3.12l.7 -.7a2.2 2.2 0 0 0 .64 -1.55v-1"/><path d="M9 12l2 2l4 -4"/></svg>
          Starter
        </span>
      </button>
    } @else if (tierName() === 'Growth') {
      <button
        class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-sm font-medium rounded-md group bg-gradient-to-br from-cyan-500 to-blue-500 group-hover:from-cyan-500 group-hover:to-blue-500 hover:text-white focus:ring-4 focus:outline-none focus:ring-cyan-200"
        (click)="goToSubscription()"
        [title]="'TOPBAR.PLAN_BADGE_TOOLTIP' | translate"
      >
        <span class="relative flex items-center gap-1.5 px-3 py-1 transition-all ease-in duration-75 bg-[var(--color-surface-raised)] rounded-sm group-hover:bg-transparent leading-5 font-semibold text-[var(--color-fg-primary)]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 7.2a2.2 2.2 0 0 1 2.2 -2.2h1a2.2 2.2 0 0 0 1.55 -.64l.7 -.7a2.2 2.2 0 0 1 3.12 0l.7 .7c.412 .41 .97 .64 1.55 .64h1a2.2 2.2 0 0 1 2.2 2.2v1c0 .58 .23 1.138 .64 1.55l.7 .7a2.2 2.2 0 0 1 0 3.12l-.7 .7a2.2 2.2 0 0 0 -.64 1.55v1a2.2 2.2 0 0 1 -2.2 2.2h-1a2.2 2.2 0 0 0 -1.55 .64l-.7 .7a2.2 2.2 0 0 1 -3.12 0l-.7 -.7a2.2 2.2 0 0 0 -1.55 -.64h-1a2.2 2.2 0 0 1 -2.2 -2.2v-1a2.2 2.2 0 0 0 -.64 -1.55l-.7 -.7a2.2 2.2 0 0 1 0 -3.12l.7 -.7a2.2 2.2 0 0 0 .64 -1.55v-1"/><path d="M9 12l2 2l4 -4"/></svg>
          Growth
        </span>
      </button>
    } @else if (tierName() === 'Scale') {
      <button
        class="relative inline-flex items-center justify-center p-0.5 overflow-hidden text-sm font-medium rounded-md group bg-gradient-to-br from-green-400 to-blue-600 group-hover:from-green-400 group-hover:to-blue-600 hover:text-white focus:ring-4 focus:outline-none focus:ring-green-200"
        (click)="goToSubscription()"
        [title]="'TOPBAR.PLAN_BADGE_TOOLTIP' | translate"
      >
        <span class="relative flex items-center gap-1.5 px-3 py-1 transition-all ease-in duration-75 bg-[var(--color-surface-raised)] rounded-sm group-hover:bg-transparent leading-5 font-semibold text-[var(--color-fg-primary)]">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 7.2a2.2 2.2 0 0 1 2.2 -2.2h1a2.2 2.2 0 0 0 1.55 -.64l.7 -.7a2.2 2.2 0 0 1 3.12 0l.7 .7c.412 .41 .97 .64 1.55 .64h1a2.2 2.2 0 0 1 2.2 2.2v1c0 .58 .23 1.138 .64 1.55l.7 .7a2.2 2.2 0 0 1 0 3.12l-.7 .7a2.2 2.2 0 0 0 -.64 1.55v1a2.2 2.2 0 0 1 -2.2 2.2h-1a2.2 2.2 0 0 0 -1.55 .64l-.7 .7a2.2 2.2 0 0 1 -3.12 0l-.7 -.7a2.2 2.2 0 0 0 -1.55 -.64h-1a2.2 2.2 0 0 1 -2.2 -2.2v-1a2.2 2.2 0 0 0 -.64 -1.55l-.7 -.7a2.2 2.2 0 0 1 0 -3.12l.7 -.7a2.2 2.2 0 0 0 .64 -1.55v-1"/><path d="M9 12l2 2l4 -4"/></svg>
          Scale
        </span>
      </button>
    }

    <!--
      The user manual, beside the user rather than in the sidebar: it is help, not a destination in the
      product's navigation, and it sat oddly among Subscription / Integrations / Settings.

      No permission gate — the manual documents the product, holds no tenant data, and hiding it would
      keep the instructions from the users with the fewest rights, who need them most. Icon-only, so it
      stays quiet next to the plan badge and the assistant.
    -->
    <!--
      ★ A TOPBAR BUTTON, NOT `ws-button`, AND THE REASON IS THE SHAPE. It has to be the round 32px control
      the avatar beside it already is; `ws-button` carries the design system's own radius and padding, and
      forcing a circle onto it would mean reaching into a shared primitive with ::ng-deep to override
      exactly the rules that make it consistent everywhere else. The topbar already styles its own
      controls this way — the avatar and the plan badges are plain buttons — so this follows the file's
      own precedent instead of bending a component from outside.

      Keeps the secondary treatment asked for: bordered and neutral, not filled.
    -->
    <button
      type="button"
      class="topbar__manual-btn"
      routerLink="/manual"
      [title]="'NAV.MANUAL' | translate"
    >
      <app-icon name="info-circle" [size]="18" />
      <!--
        The accessible name. An icon-only button has none otherwise, and `aria-label` would have to sit on
        this element anyway — projected text is what a screen reader reads out, and `title` covers the
        sighted tooltip.
      -->
      <span class="topbar__sr-only">{{ 'NAV.MANUAL' | translate }}</span>
    </button>

    <div class="topbar__avatar-wrapper">
      <button class="topbar__avatar-btn" (click)="toggleDropdown($event)">
        <span class="topbar__avatar">{{ userInitial() }}</span>
      </button>

      @if (dropdownOpen()) {
        <div class="topbar__dropdown" (click)="$event.stopPropagation()">
          <div class="topbar__dropdown-header">
            <span class="topbar__dropdown-name">{{ tenantSlug() }}</span>
            <span class="topbar__dropdown-email">{{ authService.currentUser()?.email }}</span>
          </div>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item" (click)="goToProfile()">
            <app-icon name="user" [size]="15" />
            {{ 'TOPBAR.PROFILE' | translate }}
          </button>
          <button class="topbar__dropdown-item" (click)="goToSettings()">
            <app-icon name="tenant" [size]="15" />
            {{ 'TOPBAR.TENANT_SETTINGS' | translate }}
          </button>
          <div class="topbar__dropdown-divider"></div>
          <button class="topbar__dropdown-item topbar__dropdown-item--danger" (click)="logout()">
            <app-icon name="log-out" [size]="15" />
            {{ 'TOPBAR.SIGN_OUT' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
