<ws-modal
  [isOpen]="modal.isOpen()"
  (closed)="modal.close()"
  size="sm"
  [title]="'TIER_LIMIT.TITLE' | translate"
>
  @if (modal.info(); as info) {
    <div class="tier-limit-modal__body">
      <p class="tier-limit-modal__message">
        {{ 'TIER_LIMIT.MESSAGE' | translate: { tier: info.tier, limit: info.limit } }}
      </p>
      <div class="tier-limit-modal__stats">
        <span class="tier-limit-modal__current">{{ info.currentCount }}</span>
        <span class="tier-limit-modal__sep">/</span>
        <span class="tier-limit-modal__limit">{{ info.limit }}</span>
      </div>
      <p class="tier-limit-modal__upgrade-hint">{{ 'TIER_LIMIT.UPGRADE_HINT' | translate }}</p>
    </div>
    <div class="tier-limit-modal__footer">
      <ws-button variant="ghost" (click)="modal.close()">
        {{ 'COMMON.CANCEL' | translate }}
      </ws-button>
      <ws-button variant="primary" (click)="modal.close()">
        {{ 'TIER_LIMIT.UPGRADE' | translate }}
      </ws-button>
    </div>
  }
</ws-modal>
