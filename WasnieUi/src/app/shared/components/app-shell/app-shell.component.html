<div class="shell">
  <app-sidebar />
  <div class="shell__main" [class.shell__main--collapsed]="!sidebarState.isExpanded()">
    <app-topbar />
    <app-past-due-banner />
    <main class="shell__content">
      <ng-content />
    </main>
  </div>
</div>
<!--
  Lives at shell level, not inside a route: the panel must survive navigation. Its trigger is in the
  topbar and the two never meet in the tree — AssistantStore is what connects them.
-->
<app-assistant-panel />

<ws-toast-container />
<app-two-fa-reminder />

<!-- Shell-level like the assistant panel: it is opened from here on first visit AND re-opened
     from the /manual screen, so it cannot live inside either route. -->
<app-welcome-modal />

<ws-confirmation-modal
  [isOpen]="inactivity.warningOpen()"
  [title]="'SESSION.WARNING_TITLE' | translate"
  [confirmLabel]="'SESSION.STAY_SIGNED_IN' | translate"
  [cancelLabel]="'SESSION.SIGN_OUT_NOW' | translate"
  (confirmed)="inactivity.staySignedIn()"
  (cancelled)="inactivity.signOutNow()"
>
  <p class="session-warn__body">{{ 'SESSION.WARNING_BODY' | translate }}</p>
  <p class="session-warn__countdown">{{ inactivity.countdownDisplay() }}</p>
</ws-confirmation-modal>
