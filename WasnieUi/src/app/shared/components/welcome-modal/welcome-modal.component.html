<ws-modal
  size="xl"
  [isOpen]="welcome.isOpen()"
  (closed)="welcome.close()"
>
  <div slot="header" class="welcome__header">
    <h2 class="welcome__title">{{ 'WELCOME.TITLE' | translate }}</h2>
    <p class="welcome__subtitle">{{ 'WELCOME.SUBTITLE' | translate }}</p>
  </div>

  <!--
    ws-video, the same primitive the empty states use — but here it is a PLAYER, not scenery.

    ★ `[autoplay]="false"`, ON PURPOSE. An empty state's clip is an illustration that happens to move;
    this one is the product tour, and a tour that starts talking the instant a modal appears is
    something you interrupt rather than watch. The viewer presses Play, and it plays once.

    That also makes `playFallback` redundant here and it was dropped: the button is now on screen for
    everybody, so there is no separate reduced-motion path to opt into.

    ★ THE POSTER IS NOT DECORATION — IT IS WHAT THE 4.6 MB BUYS BACK. Without it the frame sat empty
    until the whole clip had downloaded, and the fix for that was making the browser download it
    eagerly on every open, whether or not anyone pressed Play. An 11.8 KB still shows the tour
    instantly and lets the video wait to be asked for.

    ★ AND IT IS NOT FRAME ZERO, ON PURPOSE. The clip opens on a one-second fade, so its first frames
    are a half-drawn card — a cover that says "broken", not "watch me". This is 2.5s in: the first
    step of the tour fully composed. Playback still starts at 0, the way every player behaves.
    Regenerate with:
      ffmpeg -ss 2.5 -i icm.mp4 -frames:v 1 -c:v libwebp -quality 88 icm-poster.webp

    Labelled rather than decorative — unlike an empty-state loop, this clip carries the tour, so it is
    announced to assistive technology instead of being hidden from it.
  -->
  <div class="welcome__video">
    <ws-video
      src="/videos/icm.mp4"
      poster="/videos/icm-poster.webp"
      fit="contain"
      [autoplay]="false"
      [ariaLabel]="'WELCOME.VIDEO_LABEL' | translate"
    />
  </div>

  <p class="welcome__lead">{{ 'WELCOME.LEAD' | translate }}</p>

  <ul class="welcome__list">
    @for (item of capabilities; track item.titleKey) {
      <li class="welcome__item">
        <span class="welcome__item-icon" aria-hidden="true">
          <app-icon [name]="item.icon" [size]="16" />
        </span>
        <div class="welcome__item-body">
          <p class="welcome__item-title">{{ item.titleKey | translate }}</p>
          <p class="welcome__item-desc">{{ item.descKey | translate }}</p>
        </div>
      </li>
    }
  </ul>

  <div slot="footer" class="welcome__footer">
    <!--
      ★ ONE BUTTON, AND IT ONLY CLOSES. The assistant is described in the list above as something the
      product does, never as a control here: the modal is identical for every tenant, and the assistant
      is not part of the Free plan — a "Open the assistant" button would 403 for exactly the users most
      likely to be seeing this screen for the first time.
    -->
    <ws-button variant="primary" (click)="welcome.close()">
      {{ 'WELCOME.START' | translate }}
    </ws-button>
  </div>
</ws-modal>
