<!--
  ★★ SVG EN LÍNEA, NO EMOJI, Y ESO ES UN ARREGLO Y NO UNA PREFERENCIA. La primera versión usaba
  🇬🇧 🇪🇸 🇵🇱 y en Windows se veía como los pares de letras "GB", "ES", "PL": Windows no trae glifos de
  indicadores regionales, así que el navegador cae en las dos letras con las que el emoji está
  construido. El control que pide el ticket es un selector de banderas y, en la plataforma donde esto
  se desarrolla, no había ninguna bandera. Verificado en pantalla — desde el código no se ve.
-->
<span class="language-flag" aria-hidden="true">
  @switch (code()) {
    @case ('es') {
      <svg viewBox="0 0 24 16" role="presentation">
        <rect width="24" height="16" fill="#c60b1e" />
        <rect y="4" width="24" height="8" fill="#ffc400" />
      </svg>
    }
    @case ('pl') {
      <svg viewBox="0 0 24 16" role="presentation">
        <rect width="24" height="16" fill="#fff" />
        <rect y="8" width="24" height="8" fill="#dc143c" />
      </svg>
    }
    @default {
      <svg viewBox="0 0 24 16" role="presentation">
        <rect width="24" height="16" fill="#012169" />
        <path d="M0 0 L24 16 M24 0 L0 16" stroke="#fff" stroke-width="3.2" />
        <path d="M0 0 L24 16 M24 0 L0 16" stroke="#c8102e" stroke-width="1.8" />
        <path d="M12 0 V16 M0 8 H24" stroke="#fff" stroke-width="5.3" />
        <path d="M12 0 V16 M0 8 H24" stroke="#c8102e" stroke-width="3.2" />
      </svg>
    }
  }
</span>
