<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Incentra | ICM & SPM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="wasnie_logo.png">
  <script>
    try {
      var m = localStorage.getItem('wasnie.theme');
      var t = (m === 'light' || m === 'soft' || m === 'dark') ? m
        : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (_) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
